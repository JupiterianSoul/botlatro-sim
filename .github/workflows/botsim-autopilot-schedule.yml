name: botsim autopilot schedule

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

jobs:
  tick:
    if: vars.BOTSIM_AUTOPILOT == 'on'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/botsim-autopilot.yml
    with:
      command: tick
      ref: main
    secrets: inherit
