name: botsim autopilot

on:
  workflow_dispatch:
    inputs:
      command:
        description: autopilot command
        default: tick
      args:
        description: extra arguments
        default: ''
      dir:
        description: store dir
        default: autopilot
      ref:
        description: ref to run
        default: main
  workflow_call:
    inputs:
      command:
        type: string
        default: tick
      args:
        type: string
        default: ''
      dir:
        type: string
        default: autopilot
      ref:
        type: string
        default: main
  push:
    branches: ['ci-ap-*']

concurrency:
  group: botsim-autopilot
  cancel-in-progress: false

jobs:
  tick:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/game-files
        with:
          key: ${{ secrets.BOTSIM_GAME_KEY }}
      - name: Secrets
        env:
          HETZNER_TOKEN: ${{ secrets.BOTSIM_HETZNER_TOKEN }}
          SSH_KEY: ${{ secrets.BOTSIM_SSH_KEY }}
          RESULTS_KEY: ${{ secrets.BOTSIM_RESULTS_KEY }}
          NTFY_TOPIC: ${{ secrets.BOTSIM_NTFY_TOPIC }}
        run: |
          umask 077
          mkdir -p ~/.config/botsim ~/.ssh
          if [ -n "$HETZNER_TOKEN" ]; then printf '%s\n' "$HETZNER_TOKEN" > ~/.config/botsim/hetzner_token; fi
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/botsim_hetzner
            ssh-keygen -y -f ~/.ssh/botsim_hetzner > ~/.ssh/botsim_hetzner.pub
          fi
          if [ -n "$RESULTS_KEY" ]; then printf '%s\n' "$RESULTS_KEY" > ~/.config/botsim/results_deploy_key; fi
          if [ -n "$NTFY_TOPIC" ]; then printf '%s\n' "$NTFY_TOPIC" > ~/.config/botsim/ntfy_topic; fi
          cp tools/botsim/cloud/github_known_hosts ~/.config/botsim/github_known_hosts
          chmod 600 ~/.config/botsim/* ~/.ssh/botsim_hetzner* 2>/dev/null || true
      - name: Tick
        env:
          GH_TOKEN: ${{ github.token }}
          BOTSIM_AP_REF: ${{ inputs.ref }}
          COMMAND: ${{ inputs.command }}
          ARGS: ${{ inputs.args }}
          DIR: ${{ inputs.dir }}
        run: python3 tools/botsim/autopilot/autopilot.py --dir "$DIR" $COMMAND $ARGS

  unit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LUAJIT_COMMIT: 2a8e017ef1ece6a95b983ffca073d30609dce7c4
      LUAJIT_SHA256: 54705d4b1de50a9c668539b9cf0dc3170d94ffdad51fafd1cf4477e498be7144
      LUAJIT_VERSION: 2.1.1791988261
      LUAJIT_XCFLAGS: -ffp-contract=off
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/game-files
        with:
          key: ${{ secrets.BOTSIM_GAME_KEY }}
      - id: lj
        uses: actions/cache@v4
        with:
          path: ~/luajit
          key: luajit-${{ env.LUAJIT_COMMIT }}-nofma
      - name: Pinned LuaJIT
        if: steps.lj.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o lj.tar.gz "https://github.com/LuaJIT/LuaJIT/archive/$LUAJIT_COMMIT.tar.gz"
          echo "$LUAJIT_SHA256  lj.tar.gz" | sha256sum -c -
          mkdir src && tar -xzf lj.tar.gz -C src --strip-components=1
          make -C src -j"$(nproc)" PREFIX="$HOME/luajit" XCFLAGS="$LUAJIT_XCFLAGS" > /dev/null
          make -C src install PREFIX="$HOME/luajit" > /dev/null
      - name: Check LuaJIT
        run: |
          echo "$HOME/luajit/bin" >> "$GITHUB_PATH"
          ln -sf "$HOME/luajit/bin/luajit-2.1."* "$HOME/luajit/bin/luajit" 2>/dev/null || true
          "$HOME/luajit/bin/luajit" -v | grep -q "$LUAJIT_VERSION"
      - name: Autopilot tests
        run: python3 -m unittest discover -s tools/botsim/autopilot/test -v
      - name: Cloud tests
        run: |
          if [ -d tools/botsim/cloud/test ]; then python3 tools/botsim/cloud/test/run_cloud_tests.py; fi
